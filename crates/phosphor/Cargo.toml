[package]
name = "phosphor"
version = "0.1.0"
edition = "2024"

[features]
default = ["pam"]
pam = []

[dependencies]
phosphor-plugin = { path = "../phosphor-plugin" }
ratatui = "0.29"
crossterm = "0.29"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
dirs = "6"
rand = "0.9"
chrono = "0.4"
chrono-tz = "0.10"
libc = "0.2"
byteorder = "1"

[dev-dependencies]
insta = "1"
tempfile = "3"
